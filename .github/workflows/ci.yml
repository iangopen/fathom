name: CI

# Every push, except the ones this workflow makes itself: the deploy step
# below pushes to gh-pages, and that branch holds the built site with no
# package.json, so running the job there would fail on npm ci forever.
on:
  push:
    branches-ignore:
      - gh-pages

# gh-pages pushes the built site to the gh-pages branch from inside the job,
# using the GITHUB_TOKEN, which the deploy step puts in the origin URL itself
# (checkout v6+ no longer leaves credentials in .git/config).
permissions:
  contents: write

jobs:
  build:
    # Pinned, not ubuntu-latest, so a new default image can't change the deploy
    # by surprise. Bumping it is a deliberate step (see CLAUDE.md, Deployment).
    runs-on: ubuntu-24.04
    # Deploys to gh-pages serialise and are never cancelled mid-push. Other
    # branches get their own group so they don't queue behind (or evict) main.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('ci-{0}', github.ref) }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm test

      # Everything below runs only on main, and only because every step above
      # passed - a failed check anywhere fails the job and nothing publishes.
      - name: Configure git for gh-pages
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # gh-pages does not push from this checkout - it makes its own clone
          # of origin under node_modules/.cache, and that clone does NOT inherit
          # the credentials actions/checkout leaves in .git/config, so it prompts
          # for a username and dies. Putting the token in the remote URL is what
          # the clone actually picks up. Actions masks the token in logs.
          git remote set-url origin             "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      # Reuses the deploy script from package.json rather than restating the
      # gh-pages flags here. That script carries a --remove glob that clears
      # stray dotfiles off the branch; duplicating it inline would be one more
      # place for that fix to rot. See the Deployment section of claude.md.
      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        run: npm run deploy
